<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tempo">
  <!--
    Tempo favicon — aligned to the wordmark.
    Navy primary background, white 't' letterform, brass dot.
    Mirror of the tempo. wordmark scaled to the favicon canvas.
    Locked 2026-05-25 per BRAND.md Part IV — Beat Wordmark Anchor.
  -->
  <rect width="512" height="512" rx="108" fill="#142C3D"/>

  <!-- Lowercase 't' composed as geometric shapes for crisp rendering at every size.
       Crossbar + stem + bottom curl. -->
  <rect x="118" y="148" width="186" height="34" rx="14" fill="white"/>
  <rect x="195" y="98" width="34" height="278" rx="14" fill="white"/>
  <path d="M212 376 Q212 392 232 392 L268 392"
        stroke="white" stroke-width="34" stroke-linecap="round" fill="none"/>

  <!-- The Beat — brand-anchor dot in brass, sits to the right of the t baseline -->
  <circle cx="350" cy="380" r="38" fill="#A77A32"/>
</svg>
