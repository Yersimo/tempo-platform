<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tempo">
  <!--
    Tempo favicon — three-bar T mark on deep teal tile.
    Mark occupies ~60% of tile, centered on the 512×512 canvas.
    The 80×86 geometry from the brief is scaled and centered:
      scale = (512 × 0.60) / 80 = 3.84
      mark width = 80 × 3.84 = 307.2px
      mark height = 86 × 3.84 = 330.24px
    Centering offset: x = (512 - 307.2) / 2 = 102.4
                      y = (512 - 330.24) / 2 = 90.88
    Tile corner radius: 21% of 512 = 108px
  -->
  <rect width="512" height="512" rx="108" fill="#0D2A35"/>
  <g transform="translate(102.4 90.88) scale(3.84)" fill="#FFFFFF">
    <rect x="0" y="13" width="20" height="60"/>
    <rect x="30" y="0" width="20" height="86"/>
    <rect x="60" y="13" width="20" height="60"/>
  </g>
</svg>
